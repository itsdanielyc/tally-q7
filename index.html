<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:1420; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Tally</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar-inner">
        <div class="wordmark"><span class="brand-mark" aria-hidden="true">T</span> Tally</div>
        <div class="app-tools">
          <span class="mock-badge" data-testid="backend-badge" hidden></span>
          <button class="app-button" id="open-settings" type="button" disabled>Settings</button>
        </div>
      </div>
    </header>

    <main class="workspace" data-geo="workspace">
      <div class="page-heading" data-geo="heading">
        <h1>Transactions</h1>
        <div class="actions">
          <button id="import-csv" type="button" disabled>Import CSV</button>
          <button class="primary" id="add-transaction" type="button" disabled>Add transaction</button>
        </div>
      </div>

      <section class="ledger-card" aria-labelledby="ledger-title" data-geo="ledger">
        <div class="panel-heading">
          <h2 id="ledger-title">Ledger</h2>
          <p id="entry-count">Loading…</p>
        </div>
        <div class="table-scroll">
          <table aria-label="Transactions">
            <thead>
              <tr><th scope="col">Date</th><th scope="col">Payee</th><th scope="col">Category</th><th scope="col" id="amount-heading" class="amount">Amount</th><th scope="col" class="row-actions">Actions</th></tr>
            </thead>
            <tbody id="transactions"></tbody>
          </table>
        </div>
        <p class="empty-state" id="ledger-empty" hidden>No transactions yet.</p>
      </section>
      <p id="app-status" class="status" role="status" aria-atomic="true"></p>
    </main>

    <dialog id="transaction-dialog" aria-labelledby="transaction-title">
      <form id="transaction-form">
        <h2 id="transaction-title">Add transaction</h2>
        <div class="field-pair">
          <label>Date <input name="date" type="date" required /></label>
          <label><span id="amount-label">Amount</span>
            <input name="amount" inputmode="decimal" required placeholder="-12.50" aria-describedby="amount-hint" />
          </label>
        </div>
        <p class="field-hint" id="amount-hint">Use a minus sign for spending.</p>
        <label>Payee <input name="payee" type="text" required /></label>
        <label>Category <span class="optional">(optional)</span> <input name="category" list="category-options" /></label>
        <datalist id="category-options"></datalist>
        <label>Note <span class="optional">(optional)</span> <textarea name="note" rows="2"></textarea></label>
        <p class="form-error" role="alert" hidden></p>
        <div class="actions dialog-actions">
          <button type="button" data-close>Cancel</button>
          <button type="submit" class="primary">Save transaction</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" aria-labelledby="delete-title">
      <form id="delete-form">
        <h2 id="delete-title">Delete transaction?</h2>
        <p id="delete-description"></p>
        <p class="form-error" role="alert" hidden></p>
        <div class="actions dialog-actions">
          <button type="button" data-close>Cancel</button>
          <button type="submit" class="danger">Delete transaction</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form">
        <h2 id="settings-title">Settings</h2>
        <label>Ledger currency <select name="currency" aria-describedby="currency-hint"></select></label>
        <p class="field-hint" id="currency-hint">Currency can change while the ledger is empty.</p>
        <p class="form-error" role="alert" hidden></p>
        <div class="actions dialog-actions">
          <button type="button" data-close>Close</button>
          <button type="submit" class="primary">Save settings</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog" class="wide-dialog" aria-labelledby="import-title">
      <form id="import-form">
        <h2 id="import-title">Import CSV</h2>
        <p id="import-filename" class="field-hint"></p>
        <div class="field-trio">
          <label>Separator <select name="delimiter"><option value=",">Comma</option><option value=";">Semicolon</option><option value="tab">Tab</option><option value="|">Pipe</option></select></label>
          <label>Header line <input name="header" type="number" min="1" required /></label>
          <label>Date order <select name="dateOrder"><option value="MDY">Month, day, year</option><option value="DMY">Day, month, year</option><option value="YMD">Year, month, day</option></select></label>
        </div>
        <div class="field-trio">
          <label>Date column <select name="date"></select></label>
          <label>Payee column <select name="payee"></select></label>
          <label>Amount format <select name="amountFormat"><option value="signed">Signed amount</option><option value="split">Debit and credit</option></select></label>
        </div>
        <label id="signed-mapping">Amount column <select name="amount"></select></label>
        <div class="field-pair" id="split-mapping" hidden>
          <label>Debit column <select name="debit"></select></label>
          <label>Credit column <select name="credit"></select></label>
        </div>
        <section class="import-preview" aria-labelledby="preview-title">
          <h3 id="preview-title">Preview</h3>
          <p id="import-count" role="status" aria-live="polite"></p>
          <p id="import-duplicates"></p>
          <div class="table-scroll" id="preview-table" hidden>
            <table aria-label="Accepted rows"><thead><tr><th scope="col">Line</th><th scope="col">Date</th><th scope="col">Payee</th><th scope="col" class="amount">Amount</th></tr></thead><tbody id="preview-rows"></tbody></table>
          </div>
          <div id="import-rejected" hidden><h3>Rejected rows</h3><ul id="import-errors"></ul></div>
        </section>
        <p class="form-error" role="alert" hidden></p>
        <div class="actions dialog-actions">
          <button type="button" data-close>Cancel</button>
          <button type="submit" id="confirm-import" class="primary" disabled>Confirm import</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
