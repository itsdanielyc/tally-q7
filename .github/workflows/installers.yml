# Verify the candidate on all Tier 1 platforms, exercise the release bundles,
# and upload the four tested files with checksums.
name: installers

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-26
            platform: darwin-arm64
    env:
      # No certificate lookup in the keychain, so macOS builds stay unsigned
      # (ad hoc) and electron-builder never tries to notarize.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EXPECTED_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux build and runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libfuse2t64
      - run: npm ci
      - name: Check version and runner architecture
        shell: bash
        run: |
          npm run release:check
          test "$(node -p 'process.platform + "-" + process.arch')" = "$EXPECTED_PLATFORM"
      - name: Domain, contract and file-store suites
        shell: bash
        run: |
          npm run test:unit
          npm run test:contracts
          npm run test:integration
      - name: Fetch Chromium and runtime dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install --with-deps chromium --only-shell
      - name: Browser and visual checks
        env:
          CI: "1"
        run: npm run test:ui
      - name: Fetch Electron
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Build and package (nsis | dmg | deb + AppImage)
        run: npm run package
      - name: Real Electron checks
        shell: bash
        env:
          CI: "1"
          NO_AT_BRIDGE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
      - name: Install, launch, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-test.ps1
      - name: Install, launch, uninstall (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/installer-test.sh
      - name: Install, launch, uninstall (Linux, under xvfb-run)
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" bash scripts/installer-test.sh
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Upload verification screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-verification-${{ matrix.os }}
          path: |
            artifacts/e2e
            playwright-report
            test-results/ui
            test-results/e2e
          if-no-files-found: ignore
          retention-days: 14

  checksums:
    name: Assemble verified bundle set and checksums
    needs: [installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundles-*
          path: candidate
          merge-multiple: true
      - name: Assert the four expected files and verify SHA-256
        shell: bash
        run: |
          shopt -s nullglob
          cd candidate
          for extension in exe dmg deb AppImage; do
            files=(*."$extension")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected one .$extension bundle; found ${#files[@]}." >&2
              exit 1
            fi
          done
          sha256sum -- *.AppImage *.deb *.dmg *.exe > SHA256SUMS
          sha256sum --check SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
          node ../scripts/release-version.mjs --notes > RELEASE-NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 30
