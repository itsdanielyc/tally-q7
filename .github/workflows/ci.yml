name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Prove pending macOS feature slices
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI: "1"
      TRANSACTIONS_SHA: 'cf5142fa913b245f25c23c6b5b381e8502bb4faf'
      SUMMARY_SHA: '819b0657548f2dea0276e06e0fd726de20ac18de'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: test "$(node -p process.arch)" = "arm64"
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: node node_modules/electron/install.js
      - name: Verify exact transaction and summary sources
        shell: bash
        run: |
          for item in "1:$TRANSACTIONS_SHA" "4:$SUMMARY_SHA"; do
            slice="${item%%:*}"
            source="${item#*:}"
            printf '\nVerifying slice %s at %s\n' "$slice" "$source"
            git checkout --detach "$source"
            npm run test:unit
            npm run test:contracts
            npm run test:integration
            npm run test:ui:update
            npm run test:ui
            npm run build
            npm run test:e2e
            proof="artifacts/mac-gates/slice-$slice"
            mkdir -p "$proof"
            cp -R tests/ui/__snapshots__ "$proof/"
            cp artifacts/e2e/darwin-arm64.png "$proof/"
            find test-results/ui -name summary.png -exec cp {} "$proof/" \;
            git restore tests/ui/__snapshots__
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-feature-gates
          path: artifacts/mac-gates
          retention-days: 14
