name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Verify scaffold on macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Assert native runner architecture
        run: test "$(node -p process.arch)" = "arm64"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install chromium --only-shell
      - run: npm run test:ui
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run package
      - run: bash scripts/installer-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scaffold-macos-arm64
          path: |
            artifacts/e2e
            playwright-report
            release/*.dmg