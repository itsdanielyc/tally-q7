# Regenerates the per-OS pixel baselines (and the shared ARIA and geometry
# snapshots) on the runners themselves, then opens a pull request with the
# result. Baselines are never captured on a developer machine: a Windows
# laptop cannot produce a macOS baseline, and runner fonts and GPUs differ.
name: snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    name: capture and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright browsers
        # Ubuntu's apt can stall on a service-restart prompt during
        # --with-deps; keep it non-interactive and bound each attempt.
        timeout-minutes: 12
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          bound=""; command -v timeout >/dev/null && bound="timeout 420"   # macOS has no timeout(1)
          for attempt in 1 2; do
            $bound npx playwright install --with-deps chromium --only-shell && exit 0
            echo "attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Capture baselines
        env:
          CI: "1"
        run: npm run test:ui:update
      - name: Compare captured baselines and exercise browser journeys
        env:
          CI: "1"
        run: npm run test:ui
      - name: Run domain, contract and integration suites
        shell: bash
        run: |
          npm run test:unit
          npm run test:contracts
          npm run test:integration
      - name: Fetch Electron
        timeout-minutes: 5
        run: node node_modules/electron/install.js
      - name: Type-check and build the app
        run: npm run build
      - name: Real-shell journeys
        shell: bash
        env:
          CI: "1"
          NO_AT_BRIDGE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.os }}
          path: tests/ui/__snapshots__
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-verification-${{ matrix.os }}
          path: |
            artifacts/e2e
            playwright-report
            test-results/ui
            test-results/e2e
          if-no-files-found: ignore
          retention-days: 14

  propose:
    name: open pull request
    needs: [capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: snapshots-*
          path: incoming
      - name: Merge the three capture sets
        run: |
          node scripts/merge-snapshots.mjs
          git status --short tests/ui/__snapshots__
      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          git add tests/ui/__snapshots__
          if git diff --cached --quiet; then echo "No snapshot changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual snapshots from run ${{ github.run_id }}"
          if [ "$DISPATCH_REF" != "main" ]; then
            # Dispatched on a working branch: land the baselines on that branch,
            # so the pull request that is already open picks them up.
            git push origin "HEAD:$DISPATCH_REF"
          else
            branch="snapshots/update-${{ github.run_id }}"
            git checkout -b "$branch"
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title "Update visual snapshots (run ${{ github.run_id }})" --body "Baselines captured on ubuntu-latest, windows-latest and macos-15. Review the images before merging."
          fi
